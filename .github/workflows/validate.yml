name: Validate Mapping

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Verify documentation
        run: ./tools/Test-Documentation.ps1
      - name: Restore pinned dependencies
        run: |
          dotnet restore XBullet.EasyMapping.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/Diagnostics/Mapperly.UnmappedTarget/Mapperly.UnmappedTarget.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/Diagnostics/Facet.InvalidInclude/Facet.InvalidInclude.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: dotnet build XBullet.EasyMapping.slnx --no-restore --verbosity minimal -m:1
      - name: Test DTO behavior
        run: dotnet test tests/MappingComparison.Tests/MappingComparison.Tests.csproj --no-restore --no-build --verbosity minimal --logger "trx;LogFileName=comparison.trx" --results-directory artifacts/test-results
      - name: Test compiler behavior
        run: dotnet test tests/XBullet.EasyMapping.Generator.Tests/XBullet.EasyMapping.Generator.Tests.csproj --no-restore --no-build --verbosity minimal --logger "trx;LogFileName=generator.trx" --results-directory artifacts/test-results
      - name: Verify formatting
        run: dotnet format XBullet.EasyMapping.slnx --no-restore --verify-no-changes
      - name: Verify generator diagnostics
        run: ./tools/Test-GeneratorDiagnostics.ps1
      - name: Verify generated evidence
        run: ./tools/Export-GeneratedMappings.ps1 -Verify
      - name: Verify model approvals without updating
        run: ./tools/Export-ModelApprovals.ps1 -Project samples/MappingComparison.EasyMapping/MappingComparison.EasyMapping.csproj
      - name: Verify received-file build workflow
        run: ./tools/Test-ModelApprovals.ps1
      - name: Verify packed consumer
        run: ./tools/Test-Package.ps1
      - name: Verify publishing gates without publishing
        run: ./tools/Test-Publishing.ps1
      - name: Retain test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified release packages
        if: ${{ success() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: artifacts/packages/**/*.nupkg
          if-no-files-found: error
          retention-days: 14
