name: Publish NuGet

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: nuget-publishing
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source and CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      run-id: ${{ steps.release.outputs.run-id }}
      artifact-id: ${{ steps.release.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, version, main ancestry, and successful CI
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Release tags must use v<package-version>.' }
          $sha = (& git rev-parse "refs/tags/$tag^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') { throw 'Cannot resolve the release tag.' }
          & git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release commit must be on protected main.' }
          $source = @(& git show "${sha}:Directory.Build.props")
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the tagged version.' }
          [xml] $props = $source -join "`n"
          $version = [string]$props.Project.PropertyGroup.Version
          ./tools/Test-ReleaseVersion.ps1 -Tag $tag -Version $version -Prerelease ([bool]::Parse($env:RELEASE_PRERELEASE))
          & git cat-file -e "${sha}:.github/workflows/publish.yml"
          if ($LASTEXITCODE -ne 0) { throw 'Tag a commit containing the publishing workflow.' }
          $artifact = & ./tools/Get-ReleaseArtifact.ps1 -Repository $env:GITHUB_REPOSITORY -Commit $sha
          "commit=$sha" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "run-id=$($artifact.RunId)" >> $env:GITHUB_OUTPUT
          "artifact-id=$($artifact.ArtifactId)" >> $env:GITHUB_OUTPUT

  publish:
    name: Publish approved packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: nuget
    permissions:
      contents: write
      actions: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          run-id: ${{ needs.verify.outputs.run-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: artifacts/publish
      - name: Verify downloaded packages and publishing account
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) { throw 'Configure NUGET_USER in the nuget environment.' }
          ./tools/Publish-Packages.ps1 -PackageDirectory "artifacts/publish/$env:RELEASE_VERSION" -Version $env:RELEASE_VERSION -Commit $env:RELEASE_COMMIT -WhatIf
      - name: Obtain temporary NuGet credentials
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish attributes, then generator
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: ./tools/Publish-Packages.ps1 -PackageDirectory "artifacts/publish/$env:RELEASE_VERSION" -Version $env:RELEASE_VERSION -Commit $env:RELEASE_COMMIT
      - name: Attach the verified packages to the GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $headers = @{ Authorization = 'Bearer ' + $env:GITHUB_TOKEN; Accept = 'application/vnd.github+json'; 'User-Agent' = 'Release-package-upload' }
          $releaseId = [long]$env:RELEASE_ID
          $base = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId"
          $release = Invoke-RestMethod -Uri $base -Headers $headers
          foreach ($id in @('XBullet.EasyMapping.Abstractions', 'XBullet.EasyMapping')) {
            $file = Get-Item -LiteralPath "artifacts/publish/$env:RELEASE_VERSION/$id.$env:RELEASE_VERSION.nupkg"
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $existing = @($release.assets | Where-Object { $_.name -ceq $file.Name })
            if ($existing.Count) {
              if ($existing.Count -ne 1 -or $existing[0].digest -cne $digest) { throw 'An existing release asset differs; it will not be overwritten.' }
              continue
            }
            $name = [Uri]::EscapeDataString($file.Name)
            $uri = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?name=$name"
            Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $file.FullName | Out-Null
          }
